name: Mise à jour des actualités LinkedIn

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h (UTC)
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les publications
        run: node scripts/fetch-linkedin.mjs
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linkedin.json assets/linkedin || true
          git diff --cached --quiet || (git commit -m "Mise à jour des actualités LinkedIn" && git push)
